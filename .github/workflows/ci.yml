name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: SwiftLint · Testes
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o gitleaks varre o histórico inteiro

      - name: Ferramentas
        run: brew install xcodegen swiftlint gitleaks

      - name: Gitleaks
        run: gitleaks git --redact --no-banner

      - name: Scripts de release
        run: |
          scripts/test-next-version.sh
          scripts/test-check-version.sh

      - name: Gerar projeto
        run: xcodegen generate

      - name: SwiftLint
        run: swiftlint --strict

      # Sem certificado no CI: só os testes rodam, sem assinar.
      - name: Testes
        run: xcodebuild test -scheme QCYBattery -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
